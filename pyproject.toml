[tool.poetry]
name = "talk2data"
version = "0.1.0"
description = ""
authors = ["maria <mashak.1998@gmail.com>"]
readme = "README.md"
packages = [{ include = "talk2data" }]
exclude = [
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
  ".env.local",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"

# TODO: пока без TTS, его прикрутим позже, но вероятно в отдельной среде

langgraph = "1.0.0"
pydantic = "2.12.3"
python-dotenv = "1.1.1"
torch = "2.6.0"
transformers = "4.57.1"
vllm = "0.8.5"
pika = "^1.3.2"
django-environ = "^0.12.0"
numpy = "^1.26"
pandas = "^2.1"
pydantic-settings = "^2.12.0"
openai-whisper = "^20250625"
sentence-transformers = "^5.2.0"
prometheus-client = "^0.22.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I", "B"]
fix = true


[tool.poetry.group.dev.dependencies]
ruff = "^0.6.9"
pytest = "^8.0.0"
mypy = "^1.0.0"
hypothesis = "^6.103.0"

name: CI

on:
  pull_request:
    branches: [ staging ]
  push:
    branches: [ staging ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install deps
        run: poetry install --no-interaction --no-root

      # Линт (без автофикса в CI!)
      - name: Ruff lint
        run: poetry run ruff check .

      # Формат: только проверка (не менять файлы)
      - name: Ruff format (check)
        run: poetry run ruff format --check .

      - name: Tests
        run: poetry run pytest -q

      # Опционально
      - name: Typecheck
        run: poetry run mypy .
